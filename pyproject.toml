[project]
name = "shelf-life"
version = "0.2.0"
description = "Scrape, clean, and analyze Sephora Canada product pricing."
readme = "README.md"
authors = [{ name = "Hannah LeBlanc" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "requests>=2.31",
    "selenium>=4.20",
]

[project.scripts]
shelf-life = "shelf_life.cli:main"

[dependency-groups]
dev = [
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "ty>=0.0.84",
    "types-requests>=2.31",
]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "kaleido>=1.0",
    "plotly>=5.24",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
]
# Only needed for the frozen 2023 dashboards in legacy/dash_app.
dashboard = [
    "dash>=2.18",
    "dash-bootstrap-components>=1.6",
    "plotly>=5.24",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
# The formatter handles line length for code; long strings and URLs are left alone.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Notebooks import mid-file and keep exploratory expressions around.
"*.ipynb" = ["E402", "F401", "B018"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["legacy", "notebooks"]
